services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: synkacore-timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synkacore
      POSTGRES_DB: synkacore
    ports:
      - "5432:5432"
    volumes:
      - synkacore-pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synkacore"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  synkacore-pgdata:
