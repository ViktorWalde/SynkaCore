# Configuracao da instalacao — SynkaCore
#
# Este arquivo responde a pergunta que a origem do dado NAO sabe responder: o que
# significa o numero que ela envia.
#
# A origem reporta "canal 0 = 24,7". Ela nao sabe se isso e temperatura ou pressao,
# em que unidade, nem de qual equipamento. Ela e burra de proposito — assim trocar
# um sensor queimado nao exige reprogramar firmware, e a serie historica pertence
# ao PONTO DE MEDICAO, nao a peca de hardware.
#
# ESTE ARQUIVO E AUTORITATIVO. A origem tambem envia um descritor dizendo o que ela
# ACREDITA medir; ele serve para o gateway detectar discordancia — canal trocado no
# painel — e nunca para sobrescrever o que esta aqui.
#
# NAO ESCREVA ESTE ARQUIVO DO ZERO. O gateway gera um esboco a partir do que as
# origens ja declararam, com dispositivo, modulo, canal, grandeza e unidade
# preenchidos — e portanto casando com o fio por construcao:
#
#     curl http://127.0.0.1:8080/comissionamento/esboco > configuracao/instalacao.yaml
#
# Sobra voce nomear os pontos de medicao, que e a unica parte que so uma pessoa
# sabe. Digitar modulo e canal a mao para dezenas de entradas e onde o erro de
# comissionamento nasce.
#
# Copie para instalacao.yaml e ajuste. O gateway o carrega com:
#
#     ./bin/synkacore-gateway -instalacao configuracao/instalacao.yaml
#
# A validacao acontece na PARTIDA: erro de digitacao derruba o processo com
# mensagem clara, em vez de virar dado errado em silencio meses depois. Campo
# desconhecido tambem derruba — `unidad:` em vez de `unidade:` seria, num
# decodificador tolerante, um ponto sem unidade e uma serie em escala indefinida.

# Identifica esta planta. Necessario porque o produto e replicado em varias
# instalacoes e uma delas pode ter mais de um gateway: sem isso nao ha como
# consolidar nem distinguir origem depois.
instalacao: planta-piloto

# ---------------------------------------------------------------------------
# MOTIVOS DE PARADA
# ---------------------------------------------------------------------------
#
# Codigo inteiro, e nao texto livre. Texto livre produz "quebra", "Quebra" e
# "quebrou" como motivos distintos, e o relatorio agrupa errado sem ninguem
# perceber — porque cada um deles parece correto isoladamente.
#
# O codigo ZERO e reservado e nao aparece aqui: ele significa "parada ainda nao
# classificada", que e informacao legitima. O operador pode nao ter classificado, e
# forcar uma classificacao errada e pior que admitir a falta.
motivos_de_parada:
  # A versao permite ao gateway detectar deriva de vocabulario. Se a interface da
  # origem exibe rotulos de uma versao antiga, os codigos que ela envia podem
  # significar OUTRA COISA — e o dado fica errado de forma indetectavel, porque o
  # codigo continua sendo um inteiro perfeitamente valido.
  #
  # Incremente sempre que mudar o significado de um codigo. Acrescentar codigo novo
  # nao exige incrementar.
  versao: 1

  codigos:
    10: "Falta de materia-prima"
    11: "Falta de operador"
    20: "Troca de ferramenta"
    21: "Ajuste de processo"
    30: "Manutencao preventiva"
    40: "Falha eletrica"
    41: "Falha mecanica"
    42: "Falha hidraulica"

# ---------------------------------------------------------------------------
# PONTOS DE MEDICAO
# ---------------------------------------------------------------------------
#
# Cada entrada liga um CANAL FISICO de um dispositivo a um PONTO DE MEDICAO logico.
#
# O identificador do ponto aceita hierarquia com ponto, refletindo a estrutura da
# planta. Use-a: "linha-2.prensa-01.temperatura-mancal" permite consultar uma linha
# inteira depois, e "temp1" nao permite nada.
pontos_de_medicao:
  - dispositivo: camara-de-vacuo-01
    modulo: 0            # placa de expansao; zero e a propria origem
    canal: 0
    ponto: curtimento.camara-01.temperatura
    grandeza: temperatura
    unidade: Cel         # notacao UCUM: Cel, kPa, L/min, kg, %
    # Faixa plausivel do INSTRUMENTO, nao do processo.
    #
    # Leitura fora dela e MARCADA, nunca recusada: a origem mediu aquilo, e
    # descartar apagaria justamente o sintoma de um transdutor descalibrado ou de
    # um cabo rompido. O valor entra no modelo de leitura com a anomalia ao lado.
    faixa_minima: -20.0
    faixa_maxima: 200.0

  - dispositivo: camara-de-vacuo-01
    modulo: 0
    canal: 1
    ponto: curtimento.camara-01.pressao
    grandeza: pressao
    unidade: kPa
    faixa_minima: 0.0
    faixa_maxima: 120.0

  - dispositivo: camara-de-vacuo-01
    modulo: 0
    canal: 2
    ponto: curtimento.camara-01.estado
    grandeza: estado_digital
    unidade: "1"         # adimensional em UCUM; entre aspas para nao virar numero

  - dispositivo: camara-de-vacuo-01
    modulo: 0
    canal: 3
    ponto: curtimento.camara-01.pecas-produzidas
    grandeza: contagem_de_pecas
    unidade: "1"

# ---------------------------------------------------------------------------
# TROCA DE SENSOR: VIGENCIA
# ---------------------------------------------------------------------------
#
# `vigente_de` e `vigente_ate` sao OPCIONAIS. Ausentes significam "desde sempre" e
# "ainda aberto", que e o caso comum de quem nunca trocou nada — e por isso as
# entradas acima nao as declaram.
#
# Elas existem porque a serie historica pertence ao PONTO DE MEDICAO, nao a peca de
# hardware. Trocar um sensor queimado nao pode romper a continuidade da serie, e o
# dado gravado ANTES da troca precisa continuar sendo interpretado com a
# configuracao que valia naquele momento.
#
# Sem vigencia, corrigir a unidade de um ponto hoje reinterpretaria retroativamente
# todo o historico — e uma serie que muda de significado ao se editar um arquivo
# nao e uma serie confiavel.
#
# Para registrar uma troca: FECHE a entrada antiga e ABRA a nova. Nao apague a
# antiga; ela e o que explica o dado ja gravado.
#
# O intervalo e fechado-aberto: [vigente_de, vigente_ate). O instante exato da
# troca ja pertence ao sensor NOVO.
#
# Exemplo — o mancal era medido pela camara-01 e passou para a camara-02:
#
#   - dispositivo: camara-de-vacuo-01
#     canal: 4
#     ponto: curtimento.mancal.temperatura
#     grandeza: temperatura
#     unidade: Cel
#     vigente_ate: 2026-07-01        # queimou e foi substituido
#
#   - dispositivo: camara-de-vacuo-02
#     canal: 0
#     ponto: curtimento.mancal.temperatura   # MESMO ponto: a serie continua
#     grandeza: temperatura
#     unidade: Cel
#     vigente_de: 2026-07-01
#
# Duas formas de data sao aceitas, e a diferenca importa:
#
#     2026-07-01                  — dia, interpretado como meia-noite UTC
#     2026-07-01T14:30:00-03:00   — instante exato, com fuso declarado
#
# A forma simples e ambigua por natureza: "trocamos no dia 1" quer dizer horario
# LOCAL, e a planta esta em UTC-3 — meia-noite UTC e 21h do dia anterior aqui. Para
# troca de sensor isso e aceitavel, porque e evento de manutencao e nao de segundo.
# Onde o instante importar, use a forma completa.
#
# O gateway RECUSA vigencias que se cruzam: duas configuracoes valendo ao mesmo
# tempo para o mesmo canal fariam a interpretacao do dado depender de qual delas o
# codigo encontrasse primeiro.

# ---------------------------------------------------------------------------
# ADMISSAO: QUANTO CADA CLASSE DE DADO TOLERA ESPERAR NA PORTA
# ---------------------------------------------------------------------------
#
# O bloco INTEIRO e opcional, e a maioria das instalacoes nunca vai precisar dele.
# Ausente, valem os padroes dimensionados pela medicao de capacidade do projeto.
#
# O QUE ESTES NUMEROS SAO. Uma PROMESSA SOBRE O DADO, e nao um ajuste de maquina.
# "Uma amostra desta planta nao espera mais que dois segundos na porta do gateway."
#
# Quando o gateway fica saturado, ele para de aceitar tudo e passa a escolher. A
# escolha sai da mesma distincao que governa o resto do sistema:
#
#   amostra          — prefere ser RECUSADA a esperar. A proxima chega logo e carrega
#                      quase a mesma informacao; ocupar a fila com ela atrasa o que
#                      nao tem substituto.
#   evento discreto  — prefere ESPERAR a ser recusado. Parada de maquina, alarme e
#                      contagem nao tem vizinho que os reponha.
#
# Recusar NAO perde dado: a origem devolve o lote ao buffer e retransmite.
#
# O QUE ESTES NUMEROS NAO SAO. Eles nao sao calibragem de hardware. O custo de gravar
# neste disco e MEDIDO pelo proprio gateway na partida, e aparece no log e no /saude
# como `ingestion_cost_us` — voce nao precisa saber esse numero para escrever este
# bloco, e nao deveria tentar compensa-lo aqui.
#
# CONSEQUENCIA QUE VALE ENTENDER ANTES DE MEXER: num disco mais lento, o gateway
# recusa com a fila mais rasa, porque menos remessas cabem dentro da mesma promessa.
# Isso e o sistema funcionando. Se voce ver recusa alta, olhe primeiro
# `ingestion_cost_us` no /saude: custo alto significa que a midia nao comporta a
# frota, e aumentar os numeros aqui so troca recusa por atraso.
#
# admissao:
#   # Quanto uma remessa so de amostras aceita esperar. Padrao: 2s
#   espera_maxima_da_amostra: 2s
#
#   # Quanto uma remessa que carrega evento discreto aceita esperar. Padrao: 10s
#   #
#   # PRECISA ser maior ou igual ao da amostra, e o gateway RECUSA A PARTIDA se nao
#   # for. Invertido, a reserva se inverteria junto: o gateway passaria a recusar
#   # parada de maquina antes de recusar leitura de temperatura, e nada denunciaria —
#   # ele continuaria aceitando dado e respondendo saudavel enquanto a contagem de
#   # paradas ficasse permanentemente errada.
#   espera_maxima_do_evento: 10s
#
#   # Quantas remessas podem aguardar admissao ao mesmo tempo. Padrao: 1024
#   #
#   # Este e um limite de MEMORIA, e nao de politica: cada uma que espera segura o
#   # corpo da remessa vivo. Ele existe para que uma saturacao prolongada nao troque
#   # "resposta lenta" por "gateway morto por falta de memoria" — o unico modo de
#   # falha que a aquisicao nao sobrevive. Reduza-o em equipamento com pouca RAM.
#   fila_maxima: 1024
#
# Declarar so um dos campos e legitimo: os outros continuam nos padroes. Assim voce
# muda um numero sem repetir os demais e sem arriscar copiar errado o que nao queria
# mudar.

# Grandezas aceitas vem do contrato de fio e sao listadas pelo proprio gateway:
#
#     curl http://127.0.0.1:8080/contrato
#
# Elas nao sao escritas a mao em lugar nenhum do codigo — sao derivadas do enum do
# .proto por reflexao. Acrescentar uma grandeza ao contrato a torna utilizavel aqui
# automaticamente, sem ninguem precisar lembrar de atualizar uma segunda lista.
